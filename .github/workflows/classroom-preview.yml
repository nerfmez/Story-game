name: Godot 4.3 classroom cloud preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scenes/classroom_3d_pixel.tscn'
      - 'scripts/classroom_pixel.gd'
      - 'tools/build_classroom_scene.gd'
      - 'tools/package_classroom.py'
      - 'assets/classroom/**'
      - 'docs/classroom-3d/**'
      - '.github/workflows/classroom-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Download Godot 4.3
        run: |
          curl -sSLf -o /tmp/godot43.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot43.zip -d /tmp/godot43
          echo /tmp/godot43 >> "$GITHUB_PATH"
      - name: Import and rebuild the standalone scene
        run: |
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --import --quit
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tools/build_classroom_scene.gd
      - name: Render three real 3D camera views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p build/classroom-preview
          for shot in 0 1 2; do
            xvfb-run -a Godot_v4.3-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy scenes/classroom_3d_pixel.tscn -- --capture "$PWD/build/classroom-preview/view-$((shot+1)).png" --shot=$shot --no-hud
          done
      - name: Package the independent Godot project
        run: python3 tools/package_classroom.py --output build/classroom-preview
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-godot43-preview
          path: |
            build/classroom-preview/*.png
            build/classroom-preview/*.zip
          if-no-files-found: error
